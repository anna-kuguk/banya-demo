<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Шикша - онлайн-бронь</title>
<!--
  Демо-макет брони переехал в настоящую CRM (dev.banyakrp.ru/book/).
  Старые ссылки из переписок, постов и закладок ведут сюда - отсюда сразу
  уводим на живую страницу брони. Макет никуда не делся: он лежит рядом,
  файлом mockup.html, и открывается по прямому адресу.
  Метки из адреса (utm_*) переносим как есть, иначе потеряем источник гостя.
  Счётчик Метрики здесь НЕ ставим: считать надо настоящую страницу брони.
-->
<link rel="canonical" href="https://dev.banyakrp.ru/book/">
<!-- Задержка в 2 секунды - не украшение: за это время срабатывает скрипт ниже,
     который переносит utm-метки. Мгновенный refresh уводил бы гостя без них.
     Скрипт выключен у гостя - refresh отработает сам, только без меток. -->
<meta http-equiv="refresh" content="2; url=https://dev.banyakrp.ru/book/">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center;
         justify-content:center; background:#f6f4f0; color:#2c2a26;
         font:16px/1.5 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  .box { max-width:32rem; padding:2rem; text-align:center; }
  h1 { font-size:1.25rem; font-weight:600; margin:0 0 .75rem; }
  p { margin:0 0 1.25rem; color:#5c574f; }
  a { display:inline-block; padding:.75rem 1.5rem; border-radius:.5rem;
      background:#2c2a26; color:#fff; text-decoration:none; }
</style>
</head>
<body>
  <div class="box">
    <h1>Бронь «Шикши» переехала</h1>
    <p>Открываем настоящую страницу бронирования. Если ничего не произошло - вот кнопка.</p>
    <a id="go" href="https://dev.banyakrp.ru/book/">Перейти к брони</a>
  </div>
<script>
  (function () {
    var target = "https://dev.banyakrp.ru/book/" + (window.location.search || "");
    document.getElementById("go").href = target;
    window.location.replace(target);
  })();
</script>
</body>
</html>
